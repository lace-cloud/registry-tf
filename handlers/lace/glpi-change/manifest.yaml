apiVersion: '1'
axis: handler
author: lace
name: glpi-change
version: v1.0.1
displayName: GLPI Change
description: Opens a GLPI change record at pre_apply and parks the Run awaiting the external decision. The GLPI adapter runs in-tree.
categories:
  - governance
  - gating
  - change-management
runtime:
  location: in-tree
  handlerId: lace/glpi-change
verdictMode: async
timeoutSeconds: 30
signing:
  kind: none
hooks:
  available:
    - pre_apply
  default:
    - pre_apply
configSchema:
  type: object
  required:
    - externalSystemId
    - externalTemplate
  additionalProperties: false
  properties:
    externalSystemId:
      type: string
      minLength: 1
    externalTemplate:
      type: string
      minLength: 1
    fieldOverrides:
      type: object
