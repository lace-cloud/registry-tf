apiVersion: '1'
axis: handler
author: lace
name: drift-gate
version: v1.0.1
displayName: Drift Gate
description: Pre-apply drift gate. Reads recent open drift findings on the target stack and blocks when any finding meets or exceeds the configured severity threshold.
categories:
  - governance
  - gating
  - drift
runtime:
  location: in-tree
  handlerId: lace/drift-gate
verdictMode: sync
timeoutSeconds: 30
signing:
  kind: none
hooks:
  available:
    - pre_apply
  default:
    - pre_apply
configSchema:
  type: object
  additionalProperties: true
  properties: {}
