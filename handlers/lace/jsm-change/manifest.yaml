apiVersion: '1'
axis: handler
author: lace
name: jsm-change
version: v1.0.1
displayName: Jira Service Management Change
description: Opens a Jira Service Management change request at pre_apply and parks the Run awaiting the external decision. The JSM adapter runs in-tree.
categories:
  - governance
  - gating
  - change-management
runtime:
  location: in-tree
  handlerId: lace/jsm-change
verdictMode: async
timeoutSeconds: 30
signing:
  kind: none
hooks:
  available:
    - pre_apply
  default:
    - pre_apply
configSchema:
  type: object
  required:
    - externalSystemId
    - externalTemplate
  additionalProperties: false
  properties:
    externalSystemId:
      type: string
      minLength: 1
    externalTemplate:
      type: string
      minLength: 1
    fieldOverrides:
      type: object
