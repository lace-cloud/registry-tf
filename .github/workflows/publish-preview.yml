# .github/workflows/publish-preview.yml
name: publish-preview
on:
  push:
    branches: [develop]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lace-cloud/registry-publish@v1
        with:
          token: ${{ secrets.LACE_PREVIEW_TOKEN }}
          api-url: https://preview.lace.cloud
