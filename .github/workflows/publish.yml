# .github/workflows/publish.yml
name: publish
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lace-cloud/registry-publish@v1
        with:
          token: ${{ secrets.LACE_TOKEN }}
