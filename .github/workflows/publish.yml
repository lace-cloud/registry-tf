name: Publish

on:
  push:
    # main publishes to production (lace.cloud), develop to preview
    # (preview.lace.cloud); the register job's environment follows the ref.
    branches: [main, develop]
    paths:
      - 'modules/**'
      - 'scanners/**'
      - 'handlers/**'
      - 'agents/**'
  workflow_dispatch:
    inputs:
      manifest_dir:
        description: 'Manifest dir (e.g., scanners/lace/aws-drift)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # every publish is verified by GitHub's OIDC token

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LACE_ORG_CI_APP_ID }}
          private-key: ${{ secrets.LACE_ORG_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check platform-team membership
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATUS=$(gh api \
            "orgs/${{ github.repository_owner }}/teams/platform-team/memberships/${{ github.actor }}" \
            --jq '.state' 2>/dev/null || echo "not_found")
          if [ "$STATUS" != "active" ]; then
            echo "::error::@${{ github.actor }} is not a member of @${{ github.repository_owner }}/platform-team. Manual dispatch is restricted to platform-team members."
            exit 1
          fi
          echo "Authorized: @${{ github.actor }} is an active platform-team member"

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: authorize
    if: always() && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')

    outputs:
      manifests_json: ${{ steps.resolve.outputs.manifests_json }}
      manifests_found: ${{ steps.resolve.outputs.manifests_found }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve manifests
        id: resolve
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIR="${{ inputs.manifest_dir }}"
            [ -d "$DIR" ]               || { echo "::error::Directory not found: $DIR"; exit 1; }
            [ -f "$DIR/manifest.yaml" ] || { echo "::error::manifest.yaml missing in $DIR"; exit 1; }
            echo "Manual trigger: $DIR"
            echo "manifests_json=[\"$DIR\"]" >> $GITHUB_OUTPUT
            echo "manifests_found=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # The push's whole range, not just its last commit. A push that
          # creates the branch has no `before`, so every manifest is listed.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$(find modules scanners handlers agents -name manifest.yaml -type f 2>/dev/null)
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}")
          fi
          changed=$(echo "$files" | grep -E '^(modules|scanners|handlers|agents)/' || true)
          if [ -z "$changed" ]; then
            echo "No manifest changes detected"
            echo "manifests_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          find_manifest_root() {
            local dir
            dir=$(dirname "$1")
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              [ -f "$dir/manifest.yaml" ] && echo "$dir" && return 0
              dir=$(dirname "$dir")
            done
            return 1
          }

          dirs=""
          for f in $changed; do
            root=$(find_manifest_root "$f") && dirs="$dirs$root"$'\n'
          done

          unique=$(echo "$dirs" | sort -u | sed '/^$/d')
          if [ -z "$unique" ]; then
            echo "No publishable manifests found"
            echo "manifests_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Manifests to publish:"
          echo "$unique"
          json=$(echo "$unique" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "manifests_json=$json" >> $GITHUB_OUTPUT
          echo "manifests_found=true" >> $GITHUB_OUTPUT

  register:
    name: Register
    runs-on: ubuntu-latest
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.manifests_found == 'true'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'preview' }}

    strategy:
      matrix:
        manifest_dir: ${{ fromJson(needs.prepare.outputs.manifests_json) }}
      fail-fast: false

    env:
      # The Lace CLI reads its API base URL from LACE_AUTH_URL.
      LACE_AUTH_URL: ${{ github.ref_name == 'main' && 'https://lace.cloud' || 'https://preview.lace.cloud' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install minisign
        # install.sh verifies the download's signature and refuses without minisign.
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Install Lace CLI (pinned)
        run: curl -fsSL https://releases.lace.cloud/install.sh | sudo sh -s -- --version "${LACE_VERSION}"
        env:
          LACE_VERSION: v2.39.0

      - name: Authenticate
        env:
          # An environment secret: prod and preview each hold their own.
          LACE_TOKEN: ${{ secrets.LACE_TOKEN }}
        run: |
          [ -z "$LACE_TOKEN" ] && { echo "::error::LACE_TOKEN secret not set in the ${{ github.ref_name == 'main' && 'prod' || 'preview' }} environment"; exit 1; }
          echo "Publishing to $LACE_AUTH_URL"
          lace whoami

      - name: Resolve axis
        id: axis
        run: |
          DIR="${{ matrix.manifest_dir }}"
          AXIS_DIR=$(echo "$DIR" | cut -d/ -f1)
          case "$AXIS_DIR" in
            modules)         AXIS=module ;;
            scanners)        AXIS=scanner ;;
            handlers)        AXIS=handler ;;
            agents)          AXIS=agent ;;
            *)               echo "::error::Unknown axis dir: $AXIS_DIR"; exit 1 ;;
          esac
          echo "axis=$AXIS" >> $GITHUB_OUTPUT

      - name: Register
        env:
          LACE_TOKEN: ${{ secrets.LACE_TOKEN }}
        run: |
          DIR="${{ matrix.manifest_dir }}"
          AXIS="${{ steps.axis.outputs.axis }}"
          README_FLAG=""
          [ -f "$DIR/README.md" ] && README_FLAG="--readme $DIR/README.md"
          if [ "$AXIS" = module ]; then
            # A module publish certifies exactly this tree, so it is validated first.
            lace module validate --path "$DIR"
            lace registry register \
              --axis module \
              --manifest "$DIR/manifest.yaml" \
              --path "$DIR" \
              $README_FLAG
          else
            lace registry register \
              --axis "$AXIS" \
              --manifest "$DIR/manifest.yaml" \
              $README_FLAG
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [prepare, register]
    if: always()

    steps:
      - name: Report
        run: |
          echo "# Registry Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.prepare.outputs.manifests_found }}" != "true" ]; then
            echo "No manifest changes detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Manifests" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.prepare.outputs.manifests_json }}' \
            | jq -r '.[] | "- `" + . + "`"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.register.result }}" = "success" ]; then
            echo "**Result:** All manifests registered." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.register.result }}" = "failure" ]; then
            echo "**Result:** Registration failed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** ${{ needs.register.result }}" >> $GITHUB_STEP_SUMMARY
          fi
