apiVersion: '1'
axis: agent
author: lace
name: run-whisperer
version: v1.0.1
displayName: Run Whisperer
description: |
  Pre-apply advisory layer. Surfaces similar past Runs in your org's
  history, stack-level patterns, and module README warnings.
  Read-only; never gates a Run.
categories:
  - intelligence
  - advisory
  - pre-apply
runtime:
  location: in-tree
  handlerId: lace/run-whisperer
trigger:
  producer: run
  hooks:
    available:
      - post_plan
    default:
      - post_plan
emits:
  manifestation: preview
configSchema:
  type: object
  additionalProperties: false
  properties: {}
