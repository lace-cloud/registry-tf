apiVersion: "1"
axis: scanner
author: lace
name: aws-cost
version: v1.0.1
displayName: AWS Cost Scanner
description: Daily/monthly cost across linked AWS accounts. Emits cost.daily time series, cost.attribution_by_team time series, and cost.monthly_trend snapshots.
categories:
  - cost
  - aws
  - finops
provider: aws
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  findings:
    schemas:
      cost-overage:
        type: object
        additionalProperties: true
  snapshots:
    schemas:
      cost.monthly_trend:
        type: object
        additionalProperties: true
  time_series:
    schemas:
      cost.daily:
        granularity: daily
        dimensions:
          - service
          - account
        metrics:
          - EffectiveCost
          - BilledCost
      cost.attribution_by_team:
        granularity: daily
        dimensions:
          - teamId
        metrics:
          - EffectiveCost
      cost.forecast:
        granularity: monthly
        dimensions: []
        metrics:
          - forecastAmortizedCost
          - forecastLowerBound
          - forecastUpperBound
authors: []
