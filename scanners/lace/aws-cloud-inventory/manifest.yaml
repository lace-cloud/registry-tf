apiVersion: "1"
axis: scanner
author: lace
name: aws-cloud-inventory
version: v1.0.1
displayName: AWS Cloud Inventory
description: Per-region resource enumeration across services. Emits resources inventory + resources.summary snapshots.
categories:
  - inventory
  - aws
provider: aws
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  inventory:
    schemas:
      resources:
        attributesSchema:
          type: object
          additionalProperties: true
  snapshots:
    schemas:
      resources.summary:
        type: object
        additionalProperties: true
authors: []
