apiVersion: "1"
axis: scanner
author: lace
name: aws-health
version: v1.0.1
displayName: AWS Health
description: CloudWatch alarms + AWS Health events. Emits health.alarms snapshots + alarm-breach findings.
categories:
  - health
  - aws
provider: aws
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  findings:
    schemas:
      alarm-breach:
        type: object
        additionalProperties: true
  snapshots:
    schemas:
      health.alarms:
        type: object
        additionalProperties: true
authors: []
